<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<meta name="theme-color" content="#101c30">
<link rel="icon" href="data:,">
<link rel="preload" href="/pixel.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/assets/midnight-library.png" as="image">
<title>Les Archives de Minuit · The Librarian</title>
<style>
  @font-face{font-family:LibraryPixel;src:url('/pixel.ttf') format('truetype');font-display:swap}
  :root{color-scheme:dark;--night:#101c30;--ink:#302a26;--paper:#ead4a1;--dim:#8c7152;--gold:#d7ad58;--edge:#352c2a;--wood:#5c3b2b}
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--night);color:var(--ink);font:20px/1.3 LibraryPixel,monospace}button,textarea,a{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:wait;opacity:.45}[hidden]{display:none!important}
  #game{position:fixed;inset:0;height:100dvh}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}button:focus-visible,a:focus-visible,textarea:focus-visible,[tabindex="0"]:focus-visible{outline:3px solid #e4b650;outline-offset:4px}#result:focus{outline:0}
  .dialogue{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 48px));padding:24px 28px 18px;background:var(--paper);border:4px solid #bd9556;box-shadow:0 0 0 4px #3b2b26,0 0 0 8px #c09752,0 0 0 12px #292526,10px 16px 0 8px #080e1855;background-image:repeating-linear-gradient(0deg,transparent 0 3px,#8f652405 3px 4px)}
  .dialogue:before,.dialogue:after{content:"";position:absolute;top:8px;bottom:8px;width:2px;background:#b9924b55;pointer-events:none}.dialogue:before{left:8px}.dialogue:after{right:8px}
  .speaker{position:absolute;top:-20px;left:16px;margin:0;padding:2px 12px;background:#263d42;color:#ead49b;border:3px solid #c59b53;box-shadow:0 0 0 3px #302a27;font-size:20px;font-weight:normal;line-height:24px}
  textarea{display:block;width:100%;height:56px;resize:none;border:0;border-bottom:2px solid #b7955e;background:transparent;color:var(--ink);padding:4px 0;line-height:26px;border-radius:0;caret-color:#6c492f}textarea::placeholder{color:#8d7250;opacity:1}
  button{border:0;border-bottom:4px solid #342e2b;padding:8px 12px 4px;background:#36504b;color:#f0dca9;border-radius:0;box-shadow:inset 0 2px #7c9979}button:hover{background:#4b6557}button:active{transform:translateY(2px);border-bottom-width:2px}a{color:#674a2b;text-underline-offset:4px}
  .actions{display:flex;align-items:center;justify-content:flex-end;gap:16px;margin-top:12px;flex-wrap:wrap}.hint{margin-right:auto;color:#8b714f}#status{margin:4px 0 0;color:#8f422c;overflow-wrap:anywhere}#answer{white-space:pre-wrap;overflow-wrap:anywhere;max-height:min(25dvh,196px);overflow-y:auto;overscroll-behavior:contain;padding:2px 8px 4px 0;line-height:28px}#result{padding-top:24px;animation:unfold .4s steps(7,end)}.reference{background:#c9a25b40;box-shadow:none;border:0;padding:0 4px;color:#5b3c27;vertical-align:baseline;text-decoration:underline;text-underline-offset:4px}.reference:hover{background:#cba05880}#loading{padding:26px 28px}.dots{display:inline-block;animation:blink 1s steps(2,end) infinite}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .sound{position:absolute;right:20px;top:20px;min-width:64px;font-size:20px;background:#1b303ae8;color:#bba577;border:2px solid #9d7d47;box-shadow:0 0 0 3px #101c30;padding:7px 8px 5px}.sound[aria-pressed="true"]{color:#f6d681;background:#36504b}.sound:hover{background:#36504b}
  dialog{color:var(--ink);background:#593b2b;border:4px solid #c69d59;box-shadow:0 0 0 4px #332c29,0 0 0 8px #a67d42,0 0 0 12px #191b25,12px 18px 0 12px #080e1870;width:min(1080px,calc(100% - 56px));max-height:calc(100dvh - 64px);padding:10px;margin:auto;overflow:auto;overscroll-behavior:contain;animation:book-open .4s steps(7,end)}dialog::backdrop{background:#050d20b0}
  .book-tabs{display:none}.book-spread{display:grid;grid-template-columns:1fr 1.12fr;gap:0;background:var(--paper)}.book-page{padding:28px;min-width:0;position:relative;background-image:repeating-linear-gradient(0deg,transparent 0 3px,#8f652405 3px 4px)}.book-page:first-child{border-right:3px solid #ad874d;box-shadow:inset -10px 0 #b18e4d18}.book-page:last-child{box-shadow:inset 10px 0 #b18e4d18}
  .book-kicker{color:#98733f;margin:0 0 20px;font-size:20px}.book-title{font:inherit;color:#503b2b;margin:0 0 20px;padding-bottom:12px;border-bottom:2px solid #bea16b}blockquote{margin:16px 0;padding:16px;border:2px solid #b99960;background:#dbc38f;white-space:pre-wrap;line-height:28px;overflow-wrap:anywhere}dialog p{overflow-wrap:anywhere}.book-meta{color:#8c714b;margin:16px 0;line-height:26px}#book-claim{line-height:28px}.article-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:28px;max-height:49dvh;overflow:auto;overscroll-behavior:contain;padding-right:8px}.article-text mark{background:#b99142;color:#231e1c;padding:1px 0;box-shadow:0 2px #98723b}.book-actions{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 20px 10px;color:#ead4a1}.book-nav{display:flex;align-items:center;gap:16px}.book-actions button{background:#273e43;box-shadow:inset 0 2px #6f8271}.book-actions button:hover{background:#3e5b55}
  .book-context{margin:16px 0;color:#8c714b}.book-context summary{cursor:pointer;list-style:none}.book-context summary::-webkit-details-marker{display:none}.book-context summary:before{content:'> ';color:#674a2b}.book-context[open] summary:before{content:'v '}
  .reset{position:absolute;left:24px;top:24px;max-width:calc(100% - 120px);font-size:16px;background:#273e43;color:#ead4a1;box-shadow:inset 0 2px #6f8271}.reset:hover{background:#3e5b55}
  *{scrollbar-color:#a17a40 #d0b780;scrollbar-width:thin}::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:#d0b780}::-webkit-scrollbar-thumb{background:#a17a40;border:2px solid #d0b780}
  @keyframes blink{50%{opacity:.15}}@keyframes unfold{from{clip-path:inset(0 44%);opacity:.1}to{clip-path:inset(0);opacity:1}}@keyframes book-open{from{transform:translateY(16px) scaleX(.86);opacity:.1}to{transform:translateY(0) scaleX(1);opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:650px){.dialogue{bottom:max(18px,env(safe-area-inset-bottom));width:calc(100% - 40px);padding:22px 18px 14px}.speaker{left:8px;padding:2px 8px}.hint{display:none}textarea{height:82px}.actions{gap:12px;margin-top:10px}button{padding:8px 8px 4px}.actions button{flex:1}.sound{right:12px;top:12px}dialog{width:calc(100% - 40px);max-height:calc(100dvh - 48px);padding:6px}.book-spread{grid-template-columns:1fr}.book-page{padding:22px 18px}.book-page:first-child{border-right:0;border-bottom:3px solid #ad874d;box-shadow:none}.book-page:last-child{box-shadow:none}.article-text{max-height:36dvh}.book-actions{position:sticky;bottom:-1px;background:#593b2b;padding:14px 8px 8px;gap:16px}.book-nav{gap:12px}#answer{max-height:30dvh}}@media(max-height:480px){.dialogue{bottom:14px;padding:18px}textarea{height:32px}.actions{margin-top:8px}#answer{max-height:25dvh}.article-text{max-height:33dvh}.book-page{padding:18px}.book-actions{padding-top:10px}}
  @media(max-width:650px){.book-tabs{display:flex;gap:8px;padding:8px 8px 14px}.book-tabs button{flex:1}.book-tabs button[aria-pressed="true"]{background:#c29b58;color:#302a26;box-shadow:inset 0 2px #eed5a2}dialog[data-page="article"] .book-page:first-child,dialog[data-page="quote"] .book-page:last-child{display:none}.article-text{max-height:47dvh}blockquote{max-height:30dvh;overflow:auto;overscroll-behavior:contain}.book-page:first-child{border-bottom:0}}
</style>
<main id="game" aria-label="Les Archives de Minuit">
  <canvas id="library" width="768" height="512" role="img" aria-label="Bibliothèque de nuit en pixel art. Vous êtes au bureau. Le bibliothécaire consulte les archives et apporte les livres cités."></canvas>
  <button id="ambience" class="sound" type="button" aria-label="Activer l’ambiance sonore" aria-pressed="false" title="Activer l’ambiance sonore">Son</button>
  <button id="reset" class="reset" type="button">Nouvelle conversation</button>
  <form id="form" class="dialogue">
    <label class="speaker" for="question">Votre bureau</label>
    <textarea id="question" maxlength="2000" required aria-label="Votre question" placeholder="Quelle question vous amène ce soir ?"></textarea>
    <p id="status" role="status" hidden></p>
    <div class="actions"><span class="hint" aria-hidden="true">Ctrl + Entrée</span><button id="submit" type="submit">Consulter les archives &gt;</button></div>
  </form>
  <div id="loading" class="dialogue" role="status" hidden><span class="speaker">Le bibliothécaire</span><span id="loading-message">Je transmets votre question…</span></div>
  <section id="result" class="dialogue" aria-labelledby="reply-speaker" hidden tabindex="-1">
    <h1 id="reply-speaker" class="speaker">Le bibliothécaire</h1><div id="answer" tabindex="0" aria-label="Réponse"></div>
    <div class="actions"><button type="button" id="open-book">Ouvrir les livres</button><button type="button" id="new-question">Continuer &gt;</button></div>
  </section>
  <p id="scene-caption" class="sr-only" aria-live="polite">La bibliothèque vous accueille.</p>
</main>
<dialog id="source-dialog" aria-labelledby="book-title" data-page="quote">
  <div class="book-tabs" aria-label="Pages du livre"><button type="button" id="show-quote" aria-label="Lire le passage cité" aria-pressed="true">Passage</button><button type="button" id="show-article" aria-label="Lire l’article complet" aria-pressed="false">Article</button></div>
  <div class="book-spread">
    <section class="book-page"><p class="book-kicker">Votre passage</p><h2 id="book-title" class="book-title"></h2><p id="book-claim"></p><blockquote id="book-quote" tabindex="0" aria-label="Passage cité"></blockquote><p id="book-page" class="book-meta"></p><details class="book-context"><summary>Classement</summary><p id="book-section" class="book-meta"></p></details><a id="publisher" target="_blank" rel="noopener noreferrer">Source publiée &gt;</a></section>
    <section class="book-page"><p class="book-kicker">Dans le Code</p><h3 id="article-title" class="book-title">Le texte intégral</h3><div id="book-article" class="article-text" tabindex="0" aria-label="Texte intégral de l’article"></div><p id="article-status" class="book-meta" role="status"></p></section>
  </div>
  <div class="book-actions"><div class="book-nav"><button type="button" id="previous-book" aria-label="Source précédente">&lt;</button><span id="book-number"></span><button type="button" id="next-book" aria-label="Source suivante">&gt;</button></div><button type="button" id="close-book">Refermer</button></div>
</dialog>
<script src="/library.js?v=midnight-progress-4" defer></script>
</html>
